# Envia a main para o Hugging Face Space a cada push (deploy do Plano VP).
# Configuração (GitHub → Settings → Secrets and variables → Actions):
#   secret   HF_TOKEN  = token de escrita do Hugging Face
#   variable HF_SPACE  = usuario/nome-do-space (ex.: jcopaz/plano-vp)
# Sem os dois, o job só avisa e termina sem erro.
name: Sync Hugging Face Space
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Monta e envia para o Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: |
          set -e
          if [ -z "$HF_TOKEN" ] || [ -z "$HF_SPACE" ]; then
            echo "::warning::HF_TOKEN/HF_SPACE não configurados — deploy no Hugging Face ignorado."
            exit 0
          fi
          rm -rf .git diagnostico
          cp deploy/hf/README.md README.md
          # O Hugging Face recusa binários sem LFS e o Space é público: nada de planilha/dado
          # (o app usa os padrões embutidos; a aba Financeiro fica sem orçamento).
          find . \( -iname "*.xls*" -o -iname "*.csv" \) -delete
          git init -q -b main
          git config user.email "actions@github.com"
          git config user.name "github-actions"
          git add -A
          git commit -q -m "deploy ${GITHUB_SHA::7}"
          # Token em cabeçalho mascarado (não na URL, que pode aparecer em mensagem de erro).
          AUTH=$(printf 'user:%s' "$HF_TOKEN" | base64 -w0)
          echo "::add-mask::$AUTH"
          git -c http.extraHeader="Authorization: Basic $AUTH" push -f "https://huggingface.co/spaces/${HF_SPACE}" main
